name: Build Supreme Court Cause List APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SCCauseListNotifier-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create Release with APK (on tag or manual dispatch)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          name: "Supreme Court Cause List Notifier v1.0"
          tag_name: "v1.0-${{ github.run_number }}"
          body: |
            ### 📱 Supreme Court Cause List Notifier APK
            - **Package**: `in.gov.sci.causelist`
            - **Version**: 1.0
            - **Download**: Download `app-debug.apk` below and install directly onto your Android device.
            - **Features**: Automatic background monitoring (15-min interval), instant notification on cause list drop, 1-tap PDF view.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
